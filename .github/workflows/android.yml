name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: App icon (uses assets/icon.png if you add one, otherwise makes a plain one)
        run: |
          mkdir -p assets
          cat > /tmp/icon.js <<'EOF'
          const fs = require('fs');
          if (fs.existsSync('assets/icon.png')) process.exit(0);
          const sharp = require('sharp');
          const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#282c3f"/><rect x="262" y="262" width="500" height="500" rx="90" fill="none" stroke="#ffffff" stroke-width="56"/><rect x="462" y="462" width="100" height="100" fill="#ff3f6c"/></svg>';
          sharp(Buffer.from(svg)).png().toFile('assets/icon.png').then(() => console.log('icon made'));
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/icon.js

      - name: Create the Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npx @capacitor/assets generate --android

      - name: Sync config
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iconsquare-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
